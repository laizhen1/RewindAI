<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RewindAI · 本地检索对照</title><style>
body{font:16px system-ui,sans-serif;background:#f5f6f1;color:#26332f;margin:0;padding:24px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border:1px solid #dce5db;border-radius:12px;padding:20px}video{width:100%;background:#14231b}button{font:inherit;padding:8px;margin:4px;cursor:pointer}button:disabled{opacity:.5}.hint{color:#53685b;line-height:1.5}.range{border-top:1px solid #dce5db;margin-top:12px}.question{white-space:pre-wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>Local retrieval comparison / 本地检索对照</h1>
<p class="hint">请回看录像核对片段内容。时间匹配不代表回答正确或画面相关；画面候选可能误报。题目和结果仅保存在本机。 / A timestamp match does not prove factual or visual relevance. Keep private questions and results local.</p>
<div class="grid"><section><video id="video" controls preload="metadata" src="/video"></video><p id="reference"></p><div id="referenceButtons"></div></section>
<section><p id="config" class="hint"></p><p id="progress"></p><p id="question" class="question"></p><div id="routes"></div><button id="previous" type="button">Previous / 上一题</button><button id="next" type="button">Next / 下一题</button><p id="status" role="status"></p></section></div>
</main><script>
'use strict';const $=id=>document.getElementById(id);let rows=[],position=0;
function timeButton(label,range){if(!Array.isArray(range)||range.length!==2||!range.every(x=>typeof x==='number'&&Number.isFinite(x)&&x>=0)||range[1]<=range[0])return null;const b=document.createElement('button');b.type='button';b.textContent=`${label}: ${range[0].toFixed(1)}–${range[1].toFixed(1)}s`;b.onclick=()=>{$('video').currentTime=range[0];$('video').play().catch(()=>{});};return b;}
function render(){const row=rows[position];$('progress').textContent=`${position+1} / ${rows.length}`;$('question').textContent=row.question||'Question unavailable / 题目不可用';$('reference').textContent=row.reference_range?'Reference time / 参考时间':'No reference time recorded / 未记录参考时间';$('referenceButtons').replaceChildren();const ref=timeButton('Reference / 参考',row.reference_range);if(ref)$('referenceButtons').append(ref);$('routes').replaceChildren();for(const [key,title] of [['transcript','Transcript / 字幕'],['fused','Fused / 融合']]){const data=row[key]||{},box=document.createElement('div'),heading=document.createElement('h3');box.className='range';heading.textContent=title;box.append(heading);const ranges=Array.isArray(data.returned_ranges)?data.returned_ranges:[];if(!ranges.length){const p=document.createElement('p');p.textContent='No candidate / 无候选';box.append(p)}ranges.forEach((range,i)=>{const src=Array.isArray(data.returned_sources?.[i])?data.returned_sources[i].join(' + '):'';const b=timeButton(`Candidate ${i+1}${src?` (${src})`:''}`,range);if(b)box.append(b)});$('routes').append(box)}$('previous').disabled=position===0;$('next').disabled=position===rows.length-1;}
$('previous').onclick=()=>{position--;render()};$('next').onclick=()=>{position++;render()};fetch('/api/comparison').then(r=>{if(!r.ok)throw Error('Could not load the report / 无法加载报告');return r.json()}).then(data=>{rows=data.rows;$('config').textContent=`Transcript / 字幕: ${data.transcript_retrieval||'not recorded'} · Visual cutoff / 画面阈值: ${data.visual_min_score??'none / 无'}`;render()}).catch(e=>$('status').textContent=e.message);
</script></body></html>

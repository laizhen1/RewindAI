<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RewindAI subtitle review</title><style>
body{font:16px system-ui;max-width:1050px;margin:auto;padding:1rem;color:#172033}video{width:100%;max-height:45vh;background:#111}button,input,textarea{font:inherit}button{cursor:pointer;margin:.25rem}textarea{width:100%;min-height:4rem;box-sizing:border-box} .cue{border:1px solid #ccd4dd;border-radius:8px;padding:.7rem;margin:.7rem 0}.hint{color:#4a5767}#status{white-space:pre-wrap}button:disabled{cursor:default}
</style></head><body><h1>Subtitle review / 字幕核对</h1><p class="hint">Listen to the recording and correct individual cues. Original subtitles stay unchanged. Exports are private drafts, not verified transcripts; timestamps are not corrected here. / 请听原视频并逐条修正字幕；原字幕不会被修改。导出仍是私人草稿，不代表全文已核验；此工具不修改时间戳。</p><video id="video" controls preload="metadata" src="/video"></video><p><label>Find text / 搜索字幕 <input id="filter" type="search"></label> <button id="previous">Previous / 上一页</button><span id="page"></span><button id="next">Next / 下一页</button> <button id="save">Export corrected SRT / 导出修正字幕</button></p><p id="status" role="status"></p><div id="cues"></div><script>
'use strict';const $=id=>document.getElementById(id);let cues=[],edits={},page=0,dirty=false;const size=20;
function shown(){const q=$('filter').value.trim().toLowerCase();return cues.map((c,i)=>i).filter(i=>!q||(edits[i]??cues[i].text).toLowerCase().includes(q));}
function render(){const list=shown(),max=Math.max(0,Math.ceil(list.length/size)-1);page=Math.min(page,max);$('page').textContent=` ${page+1} / ${max+1} · ${list.length} cues · ${Object.keys(edits).length} edits `;$('previous').disabled=page===0;$('next').disabled=page===max;$('cues').replaceChildren();list.slice(page*size,(page+1)*size).forEach(i=>{const cue=cues[i],box=document.createElement('div');box.className='cue';const button=document.createElement('button');button.textContent=`▶ ${cue.start.toFixed(1)}–${cue.end.toFixed(1)}s`;button.addEventListener('click',()=>{$('video').currentTime=cue.start;$('video').play().catch(()=>{});});const original=document.createElement('p');original.className='hint';original.textContent=`Original: ${cue.text}`;const field=document.createElement('textarea');field.value=edits[i]??cue.text;field.setAttribute('aria-label',`Cue ${i+1}`);field.addEventListener('input',()=>{dirty=true;if(field.value===cue.text)delete edits[i];else edits[i]=field.value;$('status').textContent='Unsaved corrections / 修改尚未导出';});box.append(button,original,field);$('cues').append(box);});}
$('filter').addEventListener('input',()=>{page=0;render()});$('previous').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('save').onclick=async()=>{$('save').disabled=true;try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits})});const d=await r.json();if(!r.ok)throw Error(d.error||'Export failed');$('status').textContent=`Saved ${d.corrections} corrections locally as ${d.filename}. This is a partial draft; update the saved video subtitles in the workspace to rebuild the index. / 已保存到本机；在工作台更新视频字幕后才能用于检索。`;dirty=false;render();}catch(e){$('status').textContent=e.message}finally{$('save').disabled=false}};
async function load(){const r=await fetch('/api/cues');const d=await r.json();if(!r.ok)throw Error(d.error||'Could not read subtitles');cues=d.cues;render()}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load().catch(e=>$('status').textContent=e.message);
</script></body></html>
